# 평일 미국 장 마감 뒤(21:30 UTC = 한국 시간 다음 날 06:30) PER·PBR·배당수익률을 새 종가로 다시 계산해 올린다.
name: daily-valuation
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # Actions 화면에서 손으로도 돌릴 수 있게
permissions:
  contents: write
concurrency:
  group: data-push
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_valuation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/valuation.json
          git diff --cached --quiet || (git commit -m "매일 종가 기준 지표 갱신" && git pull --rebase && git push)
