# 평일 미국 장 마감 뒤(21:30 UTC = 한국 시간 다음 날 06:30) PER·PBR·배당수익률을 새 종가로 다시 계산하고,
# 증권사 예측 EPS vs 실제 EPS도 새로 받아 올린다.
name: daily-valuation
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # Actions 화면에서 손으로도 돌릴 수 있게
permissions:
  contents: write
concurrency:
  group: data-push
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 나스닥 종가·증권사 예측은 재배포 허락(유료 계약) 전까지 받지 않는다 (build_valuation.py, build_surprise.py)
      - run: python build_calendar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.json jurini_app/assets/calendar.json
          git diff --cached --quiet || (git commit -m "매일 일정 갱신" && git pull --rebase && git push)
