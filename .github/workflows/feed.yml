# 매시간 회사별 최신 뉴스 제목을 모아 docs/feed.json에 올린다 (앱 뉴스 탭).
name: hourly-feed
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-push   # 매일 지표 작업과 동시에 올리다 부딪히지 않게
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_feed.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json
          git diff --cached --quiet || (git commit -m "매시간 뉴스 갱신" && git pull --rebase && git push)
