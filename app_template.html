<title>미국 Top 10 기업 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column (max 420px) centered; sticky top bar, bottom tab bar, bottom-sheet for glossary terms */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunken:#F4F7F6; --fg:#16211F; --muted:#5E6E6A; --line:#DDE5E3;
  --accent:#0C6B5F; --accent-soft:#DDF0EC; --mark:#FFE58A; --good:#1F8A4C; --warn:#C2410C; --good-soft:#E3F4EA; --warn-soft:#FDEBE1;
  --seg1:#0C6B5F; --seg2:#3FA796; --seg3:#8CCFC1; --seg4:#E8B04B; --seg5:#B9C4C1; --seg6:#6E8A85; --seg7:#D7DEDC; --seg8:#A3B5B1;
  --display:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(18,40,36,.06),0 4px 16px rgba(18,40,36,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17211F; --sunken:#1D2926; --fg:#E7EFED; --muted:#9AAEA9; --line:#2A3835;
  --accent:#5CC9B6; --accent-soft:#1D3A35; --mark:#6B5A12; --good:#5BD08A; --warn:#FB8F5A; --good-soft:#163222; --warn-soft:#3A2116;
  --seg1:#5CC9B6; --seg2:#2E9483; --seg3:#1F5F55; --seg4:#E2AE4E; --seg5:#5E6F6B; --seg6:#8FB0A9; --seg7:#3A4744; --seg8:#71837F;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211F; --sunken:#1D2926; --fg:#E7EFED; --muted:#9AAEA9; --line:#2A3835;
  --accent:#5CC9B6; --accent-soft:#1D3A35; --mark:#6B5A12; --good:#5BD08A; --warn:#FB8F5A; --good-soft:#163222; --warn-soft:#3A2116;
  --seg1:#5CC9B6; --seg2:#2E9483; --seg3:#1F5F55; --seg4:#E2AE4E; --seg5:#5E6F6B; --seg6:#8FB0A9; --seg7:#3A4744; --seg8:#71837F;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:420px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:480px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;min-height:56px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar h1{font-family:var(--display);font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;margin-left:-8px}
.back:hover{background:var(--sunken)}
.asof{font-size:12px;color:var(--muted)}
main{flex:1;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.hello{display:flex;flex-direction:column;gap:4px}
.hello h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance;line-height:1.35}
.hello p{margin:0;color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:28px 44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow);border:1px solid var(--line);width:100%}
.row:hover{border-color:var(--accent)}
.rank{font-family:var(--display);font-weight:700;color:var(--muted);font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;color:#fff;letter-spacing:.02em}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:16px;font-weight:700}
.row .nm span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .cap{text-align:right;font-variant-numeric:tabular-nums}
.row .cap b{display:block;font-size:15px}
.row .cap small{color:var(--muted);font-size:11px}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--fg)}
.tip b{color:var(--accent)}
.disc{font-size:11.5px;color:var(--muted);text-align:center;padding-top:4px}

/* detail */
.hero{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;gap:12px;align-items:center}
.hero-top .logo{width:52px;height:52px;border-radius:14px;font-size:15px}
.hero-top h2{font-family:var(--display);margin:0;font-size:21px;line-height:1.25}
.hero-top p{margin:0;font-size:12.5px;color:var(--muted)}
.oneliner{font-size:16.5px;font-weight:500;line-height:1.5;margin:0;text-wrap:pretty}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--sunken);border-radius:12px;padding:10px 12px}
.fact small{display:block;font-size:12px;color:var(--muted)}
.fact b{font-size:16px;font-variant-numeric:tabular-nums}
.pc{display:grid;grid-template-columns:1fr;gap:10px}
.box{border-radius:16px;padding:14px 16px}
.box h3{margin:0 0 6px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.box.good{background:var(--good-soft)} .box.good h3{color:var(--good)}
.box.warn{background:var(--warn-soft)} .box.warn h3{color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4;background:var(--bg);padding-block:6px;margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.panel{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.panel h3{font-family:var(--display);font-size:17px;margin:0}
.panel p{margin:0;font-size:14.5px}
.sub{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--sunken);border:1px solid var(--line)}
.term{background:linear-gradient(transparent 55%,var(--mark) 55%);font-weight:500;border-radius:2px;cursor:pointer;padding:0 1px}
.term:hover{background:var(--mark)}
button.chip.termchip{cursor:pointer}
button.chip.termchip:hover{border-color:var(--accent);color:var(--accent)}
.stack{display:flex;height:18px;border-radius:9px;overflow:hidden;gap:2px}
.stack span{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:6px}
.legend div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.legend b{font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center;font-size:12.5px}
.bar .lbl{color:var(--muted);line-height:1.25}
.track{position:relative;height:26px;background:var(--sunken);border-radius:8px;overflow:hidden}
.fill{position:absolute;top:0;bottom:0;left:0;background:var(--seg2);border-radius:8px}
.fill.neg{background:var(--warn)}
.fill.latest{background:var(--accent)}
.track b{position:absolute;left:6px;background:var(--surface);padding:1px 7px;border-radius:6px;top:50%;transform:translateY(-50%);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--fg)}
.metric-switch{display:flex;gap:4px;background:var(--sunken);padding:4px;border-radius:12px}
.metric-switch button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500}
.metric-switch button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.explain{background:var(--sunken);border-radius:12px;padding:12px 14px;font-size:13.5px}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge .scale{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--good-soft),var(--sunken) 45%,var(--warn-soft))}
.gauge .avg{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.gauge .dot{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);transform:translate(-50%,-50%);box-shadow:var(--shadow)}
.gauge .ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--sunken);border-radius:12px;padding:10px 12px}
.kv small{display:block;font-size:12px;color:var(--muted)}
.kv b{font-size:17px;font-variant-numeric:tabular-nums}
.risk{display:flex;flex-direction:column;gap:8px}
.risk div{border-left:3px solid var(--warn);padding:2px 0 2px 12px;font-size:14px}
.risk div b{display:block}
.timeline{display:flex;flex-direction:column;gap:8px;font-size:14px}
.timeline div{display:flex;gap:10px}
.timeline div::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px}
.src{font-size:11.5px;color:var(--muted)}

/* glossary */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.gl{display:flex;flex-direction:column;gap:8px}
.gl button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;width:100%}
.gl button:hover{border-color:var(--accent)}
.gl b{font-size:15px}
.gl span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabbar button{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:20}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:420px;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;
  padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out;max-height:80%;overflow-y:auto}
@keyframes up{from{transform:translate(-50%,40px);opacity:.6}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet h3{font-family:var(--display);font-size:20px;margin:0}
.sheet p{margin:0;font-size:15px}
.sheet .ex{background:var(--sunken);border-radius:12px;padding:12px 14px;font-size:14px}
.sheet .ex small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.sheet .close{align-self:stretch;padding:12px;border-radius:12px;background:var(--fg);color:var(--surface);font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
</style>

<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
  <nav class="tabbar" aria-label="메뉴">
    <button id="nav-home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><rect x="5" y="11" width="3" height="7" fill="none"/><rect x="10.5" y="7" width="3" height="11" fill="none"/><rect x="16" y="4" width="3" height="14" fill="none"/></svg>기업</button>
    <button id="nav-terms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" fill="none"/><path d="M4 21V5"/><path d="M9 8h6"/></svg>용어사전</button>
  </nav>
</div>
<div id="sheet-root"></div>

<script>
const DATA = __DATA__;
const GLOSS = __GLOSSARY__;
const G = Object.fromEntries(GLOSS.terms.map(t => [t.id, t]));
const COLORS = {aapl:"#3D4A48",nvda:"#4F8A1F",msft:"#2F6DB5",googl:"#C2463A",amzn:"#D98A14",spcx:"#1E2A3A",meta:"#2D5FD3",avgo:"#B5312A",tsla:"#9E2A2A",lly:"#C21E3A"};
const SEGVARS = ["--seg1","--seg2","--seg3","--seg4","--seg5","--seg6","--seg7","--seg8"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T = (id, label) => `<span class="term" role="button" tabindex="0" data-term="${id}">${esc(label || G[id].term.replace(/\(.*\)/, ""))}</span>`;
const krw = b => b >= 1000 ? `${(b/1000).toFixed(2)}조 달러` : `${b.toLocaleString()}억 달러`;
const eok = m => `${Math.round(m/100).toLocaleString()}억 달러`;
const won = m => { const jo = m * 1e6 * 1400 / 1e12; return jo >= 1 ? `약 ${jo.toFixed(jo >= 100 ? 0 : 1)}조 원` : `약 ${Math.round(jo*10000).toLocaleString()}억 원`; };
const logo = c => `<div class="logo" style="background:${COLORS[c.id]}">${esc(c.ticker.slice(0,4))}</div>`;

let state = { view: "home", id: null, tab: "biz", metric: "revenue", q: "" };
try { const s = JSON.parse(localStorage.getItem("jurini-ui") || "{}"); if (s.view) state = { ...state, ...s }; } catch (e) {}
const save = () => { try { localStorage.setItem("jurini-ui", JSON.stringify(state)); } catch (e) {} };

function render() {
  save();
  $("#nav-home").setAttribute("aria-current", state.view !== "terms" ? "page" : "false");
  $("#nav-terms").setAttribute("aria-current", state.view === "terms" ? "page" : "false");
  if (state.view === "detail") return renderDetail(DATA.companies.find(c => c.id === state.id));
  if (state.view === "terms") return renderTerms();
  renderHome();
}

function renderHome() {
  $("#topbar").innerHTML = `<h1>미국 시가총액 Top 10</h1><span class="asof">${DATA.meta.market_cap_asof} 기준</span>`;
  $("#view").innerHTML = `
    <div class="hello"><h2>세계에서 가장 큰 미국 회사 10곳, 무슨 일을 할까요?</h2>
      <p>회사를 누르면 쉽게 풀어 쓴 기업 정보를 볼 수 있어요.</p></div>
    <div class="tip"><b>${T("market_cap","시가총액")}</b>이 뭔지 모르겠다면 형광펜 칠한 단어를 눌러보세요. 뜻을 바로 알려드려요.</div>
    <div class="list">${DATA.companies.map(c => `
      <button class="row" data-open="${c.id}">
        <span class="rank">${c.rank}</span>${logo(c)}
        <span class="nm"><b>${esc(c.name_ko)}</b><span>${esc(c.one_liner)}</span></span>
        <span class="cap"><b>${(c.market_cap_usd_b/1000).toFixed(2)}조</b><small>달러</small></span>
      </button>`).join("")}</div>
    <p class="disc">투자 공부용 정보이며 매수·매도 추천이 아닙니다.</p>`;
  window.scrollTo(0, 0);
}

const TABS = [["biz","사업"],["money","돈 버는 법"],["perf","실적"],["value","주가 수준"],["div","배당"],["risk","리스크"]];

function renderDetail(c) {
  $("#topbar").innerHTML = `<button class="back" id="back" aria-label="목록으로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button><h1>${esc(c.name_ko)}</h1><span class="asof">${c.rank}위</span>`;
  const latest = c.financials[c.financials.length - 1];
  $("#view").innerHTML = `
    <section class="hero">
      <div class="hero-top">${logo(c)}<div><h2>${esc(c.name_ko)}</h2><p>${esc(c.ticker)} · ${esc(c.exchange)} · ${esc(c.sector)}</p></div></div>
      <p class="oneliner">${esc(c.one_liner)}</p>
      <div class="facts">
        <div class="fact"><small>${T("market_cap","시가총액")}</small><b>${krw(c.market_cap_usd_b)}</b></div>
        <div class="fact"><small>1년 ${T("revenue","매출")} (${esc(latest.label.replace("최근 12개월(TTM)","최근 12개월"))})</small><b>${eok(latest.revenue)}</b></div>
      </div>
    </section>
    <section class="pc">
      <div class="box good"><h3>투자 포인트</h3><ul>${c.invest_points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div class="box warn"><h3>주의할 점</h3><ul>${c.cautions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    </section>
    <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("")}</div>
    <section class="panel" id="panel">${panel(c)}</section>
    <section class="panel">
      <h3>이 회사에 나온 용어</h3>
      <div class="chips">${c.terms.map(t=>`<button class="chip termchip" data-term="${t}">${esc(G[t].term)}</button>`).join("")}</div>
    </section>
    <p class="src">출처: ${c.sources.map(esc).join(" · ")}<br>시가총액 ${c.market_cap_asof}, 주가 지표 ${c.valuation.asof} 기준. 투자 공부용 정보이며 매수·매도 추천이 아닙니다.</p>`;
}

function mix(rows) {
  return `<div class="stack">${rows.map(([n,p],i)=>`<span style="width:${p}%;background:var(${SEGVARS[i%8]})" title="${esc(n)} ${p}%"></span>`).join("")}</div>
    <div class="legend">${rows.map(([n,p],i)=>`<div><i style="background:var(${SEGVARS[i%8]})"></i><span>${esc(n)}</span><b>${p}%</b></div>`).join("")}</div>`;
}

const METRICS = {
  revenue:["매출","revenue","회사가 1년 동안 판 금액 전체예요."],
  operating_income:["영업이익","operating_income","본업으로 남긴 이익이에요. 회사의 실력을 볼 때 가장 먼저 봐요."],
  free_cash_flow:["잉여현금","fcf","투자까지 하고 실제로 남은 현금이에요. 배당과 자사주 매입은 여기서 나와요."]
};

function panel(c) {
  const v = c.valuation, s = c.shareholder_return, b = c.balance;
  switch (state.tab) {
    case "biz": return `<h3>무슨 일을 하나요?</h3><p>${esc(c.business)}</p>
      <h3>왜 강한가요? <span class="sub">${T("moat","해자")}</span></h3><p>${esc(c.moat)}</p>
      <div><div class="sub" style="margin-bottom:6px">경쟁사</div><div class="chips">${c.competitors.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div>`;
    case "money": { const rm = c.revenue_mix; return `<h3>돈은 어디서 버나요?</h3><p class="sub">${esc(rm.fiscal_year)} 기준 ${T("revenue","매출")} 비중</p>
      ${mix(rm.by_segment)}
      ${rm.by_region.length ? `<h3>어느 나라에서 팔까요?</h3>${mix(rm.by_region)}` : ""}
      ${rm.note ? `<p class="sub">※ ${esc(rm.note)}</p>` : ""}
      <h3>앞으로 성장할 곳</h3><div class="timeline">${c.growth_drivers.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`; }
    case "perf": {
      const [label, tid, help] = METRICS[state.metric];
      const vals = c.financials.map(p => p[state.metric]);
      const max = Math.max(...vals.map(Math.abs), 1);
      const last = c.financials[c.financials.length-1];
      const nc = b.net_cash;
      return `<h3>실적은 늘고 있나요?</h3>
      <div class="metric-switch" role="group" aria-label="지표 선택">${Object.entries(METRICS).map(([k,[l]])=>`<button data-metric="${k}" aria-pressed="${state.metric===k}">${l}</button>`).join("")}</div>
      <p class="sub">${T(tid, label)}: ${help}</p>
      <div class="bars">${c.financials.map((p,i)=>{const x=p[state.metric];return `<div class="bar"><span class="lbl">${esc(p.label.replace("최근 12개월(TTM)","최근 12개월"))}</span>
        <div class="track"><div class="fill ${x<0?"neg":""} ${i===c.financials.length-1?"latest":""}" style="width:${Math.max(2,Math.abs(x)/max*100)}%"></div><b>${x<0?"−":""}${eok(Math.abs(x))}</b></div></div>`}).join("")}</div>
      <div class="kv">
        <div><small>${T("operating_margin","영업이익률")}</small><b>${last.operating_margin_pct}%</b></div>
        <div><small>${T("capex","설비투자")}</small><b>${eok(last.capex)}</b></div>
        <div><small>현금·투자자산</small><b>${eok(b.cash_and_investments)}</b></div>
        <div><small>총부채</small><b>${eok(b.total_debt)}</b></div>
      </div>
      <div class="explain">${nc>=0?`빚보다 현금이 <b>${eok(nc)}</b> 더 많아요 (${T("net_cash","순현금")}).`:`현금보다 빚이 <b>${eok(-nc)}</b> 더 많아요 (${T("net_debt","순부채")}).`} <span class="sub">${b.asof} 기준</span></div>
      ${c.financial_note?`<p class="sub">※ ${esc(c.financial_note)}</p>`:""}
      <p class="sub">1억 달러는 환율 1,400원 기준 약 1,400억 원이에요. 최근 매출 ${eok(last.revenue)} ≈ ${won(last.revenue)}.</p>`; }
    case "value": {
      const per = v.per; const pos = per==null?null:Math.min(per,60)/60*100;
      const verdict = per==null?"적자라 PER을 계산할 수 없어요":per<15?"이익에 비해 싼 편":per<=28?"시장 평균 근처":per<=45?"비싼 편":"아주 비싼 편";
      return `<h3>지금 주가, 비싼 편일까요?</h3>
      <div class="gauge">
        <div class="sub">${T("per","PER")} ${per==null?"-":per.toFixed(1)+"배"} · <b>${verdict}</b></div>
        ${per==null?"":`<div class="scale"><span class="avg" style="left:${21/60*100}%" title="미국 대형주 평균 약 21배"></span><span class="dot" style="left:${pos}%"></span></div>
        <div class="ticks"><span>0배</span><span>평균 약 20배</span><span>60배+</span></div>`}
      </div>
      <div class="kv">
        <div><small>${T("forward_per","선행 PER")}</small><b>${v.forward_per==null?"-":v.forward_per+"배"}</b></div>
        <div><small>${T("pbr","PBR")}</small><b>${v.pbr==null?"-":v.pbr+"배"}</b></div>
        <div><small>${T("roe","ROE")}</small><b>${v.roe==null?"-":v.roe+"%"}</b></div>
        <div><small>기준일</small><b style="font-size:14px">${v.asof}</b></div>
      </div>
      <div class="explain">${esc(v.comment)}</div>
      <p class="sub">평균선은 대략적인 참고값이에요. PER은 주가가 바뀌면 매일 달라져요.</p>`; }
    case "div": return `<h3>주주에게 얼마나 돌려주나요?</h3>
      ${s.dividend_per_share==null?`<div class="explain"><b>배당을 주지 않는 회사예요.</b> 번 돈을 성장에 다시 투자하고 있어요.</div>`:`
      <div class="kv">
        <div><small>1년 배당금 (1주)</small><b>$${s.dividend_per_share.toFixed(2)}</b></div>
        <div><small>${T("dividend_yield","배당수익률")}</small><b>${s.dividend_yield}%</b></div>
        <div><small>${T("payout_ratio","배당성향")}</small><b>${s.payout_ratio}%</b></div>
        <div><small>연속 배당 증가</small><b>${s.dividend_growth_years}년</b></div>
      </div>
      <p class="sub">${esc(s.frequency)}마다 지급 · 100주를 갖고 있으면 1년에 약 $${(s.dividend_per_share*100).toFixed(0)}를 받아요.</p>`}
      <h3>${T("buyback","자사주 매입")}</h3><p>${esc(s.buyback)}</p>`;
    case "risk": return `<h3>어떤 위험이 있나요?</h3>
      <div class="risk">${c.risks.map(r=>{const [h,...t]=r.split(":");return `<div><b>${esc(h)}</b>${esc(t.join(":").trim())}</div>`}).join("")}</div>
      <h3>앞으로 볼 일정</h3><div class="timeline">${c.upcoming.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`;
  }
}

function renderTerms() {
  $("#topbar").innerHTML = `<h1>용어사전</h1><span class="asof">${GLOSS.terms.length}개</span>`;
  const q = state.q.trim();
  const list = GLOSS.terms.filter(t => !q || (t.term + t.definition).includes(q));
  $("#view").innerHTML = `<input class="search" id="q" type="search" placeholder="용어 검색 (예: PER, 현금)" value="${esc(state.q)}" aria-label="용어 검색">
    <div class="gl" id="gl">${list.map(t=>`<button data-term="${t.id}"><b>${esc(t.term)}</b><span>${esc(t.definition)}</span></button>`).join("") || `<p class="sub">찾는 용어가 없어요.</p>`}</div>`;
}

function openTerm(id) {
  const t = G[id]; if (!t) return;
  const names = t.used_by.map(tk => DATA.companies.find(c => c.ticker === tk)?.name_ko).filter(Boolean);
  $("#sheet-root").innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="grab"></div>
      <span class="badge">경제용어</span><h3 id="sheet-t">${esc(t.term)}</h3><p>${esc(t.definition)}</p>
      <div class="ex"><small>예시</small>${esc(t.example)}</div>
      <p class="sub">이 용어가 나오는 회사: ${names.map(esc).join(", ")}</p>
      <button class="close" id="sheet-close">알겠어요</button></div>`;
  $("#sheet-close").focus();
}
const closeSheet = () => { $("#sheet-root").innerHTML = ""; };

document.addEventListener("click", e => {
  const el = e.target.closest("[data-term],[data-open],[data-tab],[data-metric],#back,#nav-home,#nav-terms,#scrim,#sheet-close");
  if (!el) return;
  if (el.dataset.term) return openTerm(el.dataset.term);
  if (el.id === "scrim" || el.id === "sheet-close") return closeSheet();
  if (el.dataset.open) { state = { ...state, view: "detail", id: el.dataset.open, tab: "biz", metric: "revenue" }; render(); window.scrollTo(0,0); return; }
  if (el.dataset.tab) { state.tab = el.dataset.tab; save(); $("#panel").innerHTML = panel(DATA.companies.find(c=>c.id===state.id)); document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===state.tab)); return; }
  if (el.dataset.metric) { state.metric = el.dataset.metric; save(); $("#panel").innerHTML = panel(DATA.companies.find(c=>c.id===state.id)); return; }
  if (el.id === "back" || el.id === "nav-home") { state.view = "home"; render(); return; }
  if (el.id === "nav-terms") { state.view = "terms"; render(); window.scrollTo(0,0); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".term")) { e.preventDefault(); openTerm(e.target.dataset.term); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  state.q = e.target.value; save();
  const q = state.q.trim();
  const list = GLOSS.terms.filter(t => !q || (t.term + t.definition).includes(q));
  $("#gl").innerHTML = list.map(t=>`<button data-term="${t.id}"><b>${esc(t.term)}</b><span>${esc(t.definition)}</span></button>`).join("") || `<p class="sub">찾는 용어가 없어요.</p>`;
});
render();
</script>
