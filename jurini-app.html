const G = Object.fromEntries(GLOSS.terms.map(t => [t.id, t]));

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T = (id, label) => `<span class="term" role="button" tabindex="0" data-term="${id}">${esc(label || G[id].term.replace(/\(.*\)/, ""))}</span>`;
const krw = b => b >= 1000 ? `${(b/1000).toFixed(2)}조 달러` : `${b.toLocaleString()}억 달러`;
const eok = m => `${Math.round(m/100).toLocaleString()}억 달러`;
const won = m => { const jo = m * 1e6 * 1400 / 1e12; return jo >= 1 ? `약 ${jo.toFixed(jo >= 100 ? 0 : 1)}조 원` : `약 ${Math.round(jo*10000).toLocaleString()}억 원`; };
const logo = c => `<div class="logo" style="background:${COLORS[c.id]}">${esc(c.ticker.slice(0,4))}</div>`;

let state = { view: "home", id: null, tab: "biz", metric: "revenue", q: "" };
try { const s = JSON.parse(localStorage.getItem("jurini-ui") || "{}"); if (s.view) state = { ...state, ...s }; } catch (e) {}
const save = () => { try { localStorage.setItem("jurini-ui", JSON.stringify(state)); } catch (e) {} };

function render() {
  save();
  $("#nav-home").setAttribute("aria-current", state.view !== "terms" ? "page" : "false");
  $("#nav-terms").setAttribute("aria-current", state.view === "terms" ? "page" : "false");
  if (state.view === "detail") return renderDetail(DATA.companies.find(c => c.id === state.id));

function mix(rows) {
  return `<div class="stack">${rows.map(([n,p],i)=>`<span style="width:${p}%;background:var(${SEGVARS[i%8]})" title="${esc(n)} ${p}%"></span>`).join("")}</div>

}

      <p class="sub">${T(tid, label)}: ${help}</p>
      <div class="bars">${c.financials.map((p,i)=>{const x=p[state.metric];return `<div class="bar"><span class="lbl">${esc(p.label.replace("최근 12개월(TTM)","최근 12개월"))}</span>
        <div class="track"><div class="fill ${x<0?"neg":""} ${i===c.financials.length-1?"latest":""}" style="width:${Math.max(2,Math.abs(x)/max*100)}%"></div><b>${x<0?"−":""}${eok(Math.abs(x))}</b></div></div>`}).join("")}</div>
      <div class="kv">
        <div><small>${T("operating_margin","영업이익률")}</small><b>${last.operating_margin_pct}%</b></div>
        <div><small>${T("capex","설비투자")}</small><b>${eok(last.capex)}</b></div>
        <div><small>현금·투자자산</small><b>${eok(b.cash_and_investments)}</b></div>
        <div><small>총부채</small><b>${eok(b.total_debt)}</b></div>
      </div>
      <div class="explain">${nc>=0?`빚보다 현금이 <b>${eok(nc)}</b> 더 많아요 (${T("net_cash","순현금")}).`:`현금보다 빚이 <b>${eok(-nc)}</b> 더 많아요 (${T("net_debt","순부채")}).`} <span class="sub">${b.asof} 기준</span></div>
      ${c.financial_note?`<p class="sub">※ ${esc(c.financial_note)}</p>`:""}
      <p class="sub">1억 달러는 환율 1,400원 기준 약 1,400억 원이에요. 최근 매출 ${eok(last.revenue)} ≈ ${won(last.revenue)}.</p>`; }
    case "value": {
      const per = v.per; const pos = per==null?null:Math.min(per,60)/60*100;
      const verdict = per==null?"적자라 PER을 계산할 수 없어요":per<15?"이익에 비해 싼 편":per<=28?"시장 평균 근처":per<=45?"비싼 편":"아주 비싼 편";
      return `<h3>지금 주가, 비싼 편일까요?</h3>
      <div class="gauge">
        <div class="sub">${T("per","PER")} ${per==null?"-":per.toFixed(1)+"배"} · <b>${verdict}</b></div>
        ${per==null?"":`<div class="scale"><span class="avg" style="left:${21/60*100}%" title="미국 대형주 평균 약 21배"></span><span class="dot" style="left:${pos}%"></span></div>
        <div class="ticks"><span>0배</span><span>평균 약 20배</span><span>60배+</span></div>`}
      </div>
      <div class="kv">
        <div><small>${T("forward_per","선행 PER")}</small><b>${v.forward_per==null?"-":v.forward_per+"배"}</b></div>
        <div><small>${T("pbr","PBR")}</small><b>${v.pbr==null?"-":v.pbr+"배"}</b></div>
        <div><small>${T("roe","ROE")}</small><b>${v.roe==null?"-":v.roe+"%"}</b></div>
        <div><small>기준일</small><b style="font-size:14px">${v.asof}</b></div>
      </div>
      <div class="explain">${esc(v.comment)}</div>
      <p class="sub">평균선은 대략적인 참고값이에요. PER은 주가가 바뀌면 매일 달라져요.</p>`; }
    case "div": return `<h3>주주에게 얼마나 돌려주나요?</h3>
      ${s.dividend_per_share==null?`<div class="explain"><b>배당을 주지 않는 회사예요.</b> 번 돈을 성장에 다시 투자하고 있어요.</div>`:`
      <div class="kv">
        <div><small>1년 배당금 (1주)</small><b>$${s.dividend_per_share.toFixed(2)}</b></div>
        <div><small>${T("dividend_yield","배당수익률")}</small><b>${s.dividend_yield}%</b></div>
        <div><small>${T("payout_ratio","배당성향")}</small><b>${s.payout_ratio}%</b></div>
        <div><small>연속 배당 증가</small><b>${s.dividend_growth_years}년</b></div>
      </div>
      <p class="sub">${esc(s.frequency)}마다 지급 · 100주를 갖고 있으면 1년에 약 $${(s.dividend_per_share*100).toFixed(0)}를 받아요.</p>`}
      <h3>${T("buyback","자사주 매입")}</h3><p>${esc(s.buyback)}</p>`;
    case "risk": return `<h3>어떤 위험이 있나요?</h3>
      <div class="risk">${c.risks.map(r=>{const [h,...t]=r.split(":");return `<div><b>${esc(h)}</b>${esc(t.join(":").trim())}</div>`}).join("")}</div>
      <h3>앞으로 볼 일정</h3><div class="timeline">${c.upcoming.map(x=>`<div>${esc(x)}</div>`).join("")}</div>`;
  }
}

function renderTerms() {
  $("#topbar").innerHTML = `<h1>용어사전</h1><span class="asof">${GLOSS.terms.length}개</span>`;
  const q = state.q.trim();
  const list = GLOSS.terms.filter(t => !q || (t.term + t.definition).includes(q));
  $("#view").innerHTML = `<input class="search" id="q" type="search" placeholder="용어 검색 (예: PER, 현금)" value="${esc(state.q)}" aria-label="용어 검색">
    <div class="gl" id="gl">${list.map(t=>`<button data-term="${t.id}"><b>${esc(t.term)}</b><span>${esc(t.definition)}</span></button>`).join("") || `<p class="sub">찾는 용어가 없어요.</p>`}</div>`;
}

function openTerm(id) {
  const t = G[id]; if (!t) return;
  const names = t.used_by.map(tk => DATA.companies.find(c => c.ticker === tk)?.name_ko).filter(Boolean);
  $("#sheet-root").innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t"><div class="grab"></div>
      <span class="badge">경제용어</span><h3 id="sheet-t">${esc(t.term)}</h3><p>${esc(t.definition)}</p>
      <div class="ex"><small>예시</small>${esc(t.example)}</div>
      <p class="sub">이 용어가 나오는 회사: ${names.map(esc).join(", ")}</p>
      <button class="close" id="sheet-close">알겠어요</button></div>`;
  $("#sheet-close").focus();
}
const closeSheet = () => { $("#sheet-root").innerHTML = ""; };

document.addEventListener("click", e => {
  const el = e.target.closest("[data-term],[data-open],[data-tab],[data-metric],#back,#nav-home,#nav-terms,#scrim,#sheet-close");
  if (!el) return;
  if (el.dataset.term) return openTerm(el.dataset.term);
  if (el.id === "scrim" || el.id === "sheet-close") return closeSheet();
  if (el.dataset.open) { state = { ...state, view: "detail", id: el.dataset.open, tab: "biz", metric: "revenue" }; render(); window.scrollTo(0,0); return; }
  if (el.dataset.tab) { state.tab = el.dataset.tab; save(); $("#panel").innerHTML = panel(DATA.companies.find(c=>c.id===state.id)); document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===state.tab)); return; }
  if (el.dataset.metric) { state.metric = el.dataset.metric; save(); $("#panel").innerHTML = panel(DATA.companies.find(c=>c.id===state.id)); return; }
  if (el.id === "back" || el.id === "nav-home") { state.view = "home"; render(); return; }
  if (el.id === "nav-terms") { state.view = "terms"; render(); window.scrollTo(0,0); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".term")) { e.preventDefault(); openTerm(e.target.dataset.term); }
});
document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  state.q = e.target.value; save();
  const q = state.q.trim();
  const list = GLOSS.terms.filter(t => !q || (t.term + t.definition).includes(q));
  $("#gl").innerHTML = list.map(t=>`<button data-term="${t.id}"><b>${esc(t.term)}</b><span>${esc(t.definition)}</span></button>`).join("") || `<p class="sub">찾는 용어가 없어요.</p>`;
});
render();
</script>
